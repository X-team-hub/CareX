<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - CareX</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="wrap">

    <header>
      <h1 data-i18n="app_name">CareX</h1>
    </header>

    <h2 data-i18n="reset_password">Reset Password</h2>

    <p class="sub" data-i18n="enter_new_password">
      Enter your new password below.
    </p>

    <form onsubmit="handleResetPassword(event)">

      <label for="password" data-i18n="new_password">
        New Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirm_password" data-i18n="confirm_new_password">
        Confirm New Password
      </label>

      <input
        id="confirm_password"
        name="confirm_password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit" data-i18n="update_password">
        Update Password
      </button>

    </form>

    <p style="text-align:center;margin-top:16px;">
      <a
        href="login.html"
        style="color:var(--rose);text-decoration:none;"
        data-i18n="back_to_login">
        Back to Login
      </a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>

</body>
</html>
