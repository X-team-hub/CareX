<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctors - CareX</title>
<link rel="icon" type="image/png" href="assets\images\20261003_115356.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .doctors-page {
      max-width: 1280px;
    }

    .doctors-content {
      max-width: 640px;
      margin: 0 auto;
    }

    .doc {
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px 0;
      border-bottom:1px solid var(--line);
    }

    .doc:last-child {
      border-bottom:0;
    }

    .av {
      width:50px;
      height:50px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--rose2);
      color:var(--rose);
      font-weight:700;
      flex-shrink:0;
    }

    .doc-info {
      flex:1;
      min-width:0;
    }

    .doc-name {
      font-weight:700;
      font-size:1rem;
    }

    .doc-meta {
      margin-top:4px;
      font-size:.84rem;
    }

    .verified {
      color:var(--sage);
      font-size:.8rem;
      margin-top:5px;
    }

    .doc-price {
      text-align:right;
      flex-shrink:0;
    }

    .doc-price button {
      margin-top:6px;
      padding:8px 12px;
      font-size:.82rem;
    }

    .doctor-tabs {
      position:relative;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:4px;
      padding:5px;
      margin:0 0 20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--card);
      box-shadow:var(--shadow);
      isolation:isolate;
    }

    .doctor-tabs::before {
      position:absolute;
      z-index:-1;
      inset:5px auto 5px 5px;
      width:calc(50% - 2px);
      border-radius:11px;
      background:linear-gradient(135deg,var(--rose),var(--plum2));
      content:"";
      transition:transform .28s cubic-bezier(.2,.8,.2,1);
    }

    .doctor-tabs[data-active-tab="find"]::before {
      transform:translateX(100%);
    }

    .doctor-tab {
      min-height:46px;
      padding:10px 12px;
      border:0;
      border-radius:11px;
      background:transparent;
      color:var(--mute);
      font-weight:700;
      transition:color .2s ease,transform .2s ease;
    }

    .doctor-tab[aria-selected="true"] {
      color:#fff;
    }

    .doctor-tab:hover {
      transform:translateY(-1px);
    }

    .doctor-tab-count {
      display:inline-grid;
      min-width:21px;
      height:21px;
      margin-left:5px;
      padding:0 5px;
      place-items:center;
      border-radius:999px;
      background:rgba(255,255,255,.2);
      font-size:.75rem;
    }

    .doctor-tab[aria-selected="false"] .doctor-tab-count {
      background:var(--rose2);
      color:var(--plum);
    }

    #doc-list {
      animation:doctor-panel-in .24s ease both;
    }

    @keyframes doctor-panel-in {
      from { opacity:0; transform:translateY(7px); }
      to { opacity:1; transform:translateY(0); }
    }

    .doc-status {
      display:inline-flex;
      align-items:center;
      margin-top:6px;
      padding:4px 9px;
      border-radius:999px;
      background:var(--sage2);
      color:var(--sage);
      font-size:.76rem;
      font-weight:700;
    }

    .doc-status.booked {
      background:var(--sage2);
      color:var(--sage);
    }

    .appointment-meta {
      margin-top:6px;
      font-size:.84rem;
    }

    .doc-price button:disabled {
      cursor:not-allowed;
      opacity:.72;
    }

    @media (prefers-reduced-motion:reduce) {
      .doctor-tabs::before,
      .doctor-tab,
      #doc-list {
        animation:none;
        transition:none;
      }
    }

    #dlg {
      width:min(92%,420px);
      border:0;
      border-radius:20px;
      padding:22px;
      background:var(--card);
      color:var(--text);
    }

    #dlg::backdrop {
      background:rgba(0,0,0,.35);
    }

    #dlg label {
      display:block;
      margin-top:14px;
      margin-bottom:6px;
      font-weight:600;
    }

    #dlg select {
      width:100%;
      padding:11px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--bg);
      color:var(--text);
    }
  </style>
  <link rel="stylesheet" href="css/app-navigation.css">
</head>

<body>

  <div class="wrap doctors-page">

    <header class="app-topbar">
      <a href="home.html" class="app-brand">
        <img src="assets/images/20261003_115356.png" alt="CareX">
        Care<span>X</span>
      </a>

      <nav class="app-desktop-nav" aria-label="Main navigation">
        <a href="home.html"><span>🏠</span> <span data-i18n="home">Home</span></a>
        <a href="track.html"><span>✏️</span> <span data-i18n="track">Track</span></a>
        <a href="insights.html"><span>📈</span> <span data-i18n="insights">Insights</span></a>
        <a href="assistant.html"><span>💬</span> <span data-i18n="assistant">Ask</span></a>
        <a href="profile.html"><span>👤</span> <span data-i18n="profile">Profile</span></a>
      </nav>

      <div class="app-controls">
        <button class="app-control" type="button" onclick="setLang(getLang()==='en'?'hi':'en')">
          🌐 <span id="lang-label">HI</span>
        </button>
        <button class="app-control" type="button" onclick="toggleTheme()" aria-label="Toggle theme">☀️ / 🌙</button>
      </div>
    </header>

    <main class="doctors-content">
      <div class="doctor-tabs" role="tablist" aria-label="Doctor lists" data-active-tab="find">
        <button class="doctor-tab" id="your-doctors-tab" type="button" role="tab" aria-selected="false" aria-controls="doc-list" tabindex="-1" data-doctor-tab="your">
          <span data-i18n="your_doctor">Your Doctor</span>
          <span class="doctor-tab-count" id="your-doctor-count" aria-label="Booked doctors">0</span>
        </button>
        <button class="doctor-tab" id="find-doctor-tab" type="button" role="tab" aria-selected="true" aria-controls="doc-list" tabindex="0" data-doctor-tab="find">
          <span data-i18n="find_doctor">Find Doctor</span>
        </button>
      </div>

      <h1 data-i18n="talk_to_doctor">Talk to a Doctor</h1>

      <p class="sub" id="doctor-list-description">
        Verified professionals by video, audio or chat. Private by default.
      </p>

      <div class="card" id="doc-list" role="tabpanel" aria-labelledby="find-doctor-tab" tabindex="0" aria-live="polite">
        <div class="notice" data-i18n="loading_doctors">Loading doctors…</div>
      </div>

      <p class="disc" data-i18n="emergency">
        Emergency signs need in-person care right away.
      </p>
    </main>

  </div>

  <dialog id="dlg">

    <h3 id="d-name"></h3>

    <p class="mute" id="d-spec"></p>

    <p id="d-info"></p>

    <label for="d-date" data-i18n="choose_date">
      Date
    </label>
    <input id="d-date" type="date" required style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:12px;">

    <label data-i18n="choose_slot">
      Choose a slot
    </label>

    <select id="d-time">
      <option value="18:00" data-i18n="today_slot">
        Today, 6:00 PM
      </option>

      <option value="10:30" data-i18n="tomorrow_slot">
        Tomorrow, 10:30 AM
      </option>
    </select>

    <label data-i18n="mode">
      Mode
    </label>

    <select id="d-mode">
      <option value="video" data-i18n="video">
        Video call
      </option>

      <option value="audio" data-i18n="audio">
        Audio call
      </option>

      <option value="chat" data-i18n="chat">
        Chat
      </option>
    </select>

    <div style="display:flex;gap:8px;margin-top:16px;">

      <button id="book-btn" data-i18n="book_consultation">
        Book
      </button>

      <button
        class="ghost"
        id="cancel-btn"
        data-i18n="cancel">
        Cancel
      </button>

    </div>

  </dialog>

  <nav class="bottom-nav app-bottom-nav" aria-label="Main navigation">

    <a href="home.html" class="nav-item">
      <span>🏠</span>
      <span data-i18n="home">Home</span>
    </a>

    <a href="track.html" class="nav-item">
      <span>✏️</span>
      <span data-i18n="track">Track</span>
    </a>

    <a href="insights.html" class="nav-item">
      <span>📈</span>
      <span data-i18n="insights">Insights</span>
    </a>

    <a href="assistant.html" class="nav-item">
      <span>💬</span>
      <span data-i18n="assistant">Ask</span>
    </a>

    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span data-i18n="profile">Profile</span>
    </a>

  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
<script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/doctors.js"></script>

</body>
</html>
