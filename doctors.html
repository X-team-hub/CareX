<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctors - CareX</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .doctors-page {
      max-width: 1280px;
    }

    .doctors-content {
      max-width: 640px;
      margin: 0 auto;
    }

    .doc {
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px 0;
      border-bottom:1px solid var(--line);
    }

    .doc:last-child {
      border-bottom:0;
    }

    .av {
      width:50px;
      height:50px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--rose2);
      color:var(--rose);
      font-weight:700;
      flex-shrink:0;
    }

    .doc-info {
      flex:1;
      min-width:0;
    }

    .doc-name {
      font-weight:700;
      font-size:1rem;
    }

    .doc-meta {
      margin-top:4px;
      font-size:.84rem;
    }

    .verified {
      color:var(--sage);
      font-size:.8rem;
      margin-top:5px;
    }

    .doc-price {
      text-align:right;
      flex-shrink:0;
    }

    .doc-price button {
      margin-top:6px;
      padding:8px 12px;
      font-size:.82rem;
    }

    #dlg {
      width:min(92%,420px);
      border:0;
      border-radius:20px;
      padding:22px;
      background:var(--card);
      color:var(--text);
    }

    #dlg::backdrop {
      background:rgba(0,0,0,.35);
    }

    #dlg label {
      display:block;
      margin-top:14px;
      margin-bottom:6px;
      font-weight:600;
    }

    #dlg select {
      width:100%;
      padding:11px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--bg);
      color:var(--text);
    }
  </style>
  <link rel="stylesheet" href="css/app-navigation.css">
</head>

<body>

  <div class="wrap doctors-page">

    <header class="app-topbar">
      <a href="home.html" class="app-brand">
        <img src="assets/images/20261003_115356.png" alt="CareX">
        Care<span>X</span>
      </a>

      <nav class="app-desktop-nav" aria-label="Main navigation">
        <a href="home.html"><span>🏠</span> <span data-i18n="home">Home</span></a>
        <a href="track.html"><span>✏️</span> <span data-i18n="track">Track</span></a>
        <a href="insights.html"><span>📈</span> <span data-i18n="insights">Insights</span></a>
        <a href="assistant.html"><span>💬</span> <span data-i18n="assistant">Ask</span></a>
        <a href="profile.html"><span>👤</span> <span data-i18n="profile">Profile</span></a>
      </nav>

      <div class="app-controls">
        <button class="app-control" type="button" onclick="setLang(getLang()==='en'?'hi':'en')">
          🌐 <span id="lang-label">HI</span>
        </button>
        <button class="app-control" type="button" onclick="toggleTheme()" aria-label="Toggle theme">☀️ / 🌙</button>
      </div>
    </header>

    <main class="doctors-content">
      <h1 data-i18n="talk_to_doctor">Talk to a Doctor</h1>

      <p class="sub" data-i18n="verified">
        Verified professionals by video, audio or chat. Private by default.
      </p>

      <div class="card" id="doc-list"></div>

      <p class="disc" data-i18n="emergency">
        Emergency signs need in-person care right away.
      </p>
    </main>

  </div>

  <dialog id="dlg">

    <h3 id="d-name"></h3>

    <p class="mute" id="d-spec"></p>

    <p id="d-info"></p>

    <label data-i18n="choose_slot">
      Choose a slot
    </label>

    <select id="d-time">
      <option value="18:00" data-i18n="today_slot">
        Today, 6:00 PM
      </option>

      <option value="10:30" data-i18n="tomorrow_slot">
        Tomorrow, 10:30 AM
      </option>
    </select>

    <label data-i18n="mode">
      Mode
    </label>

    <select id="d-mode">
      <option value="video" data-i18n="video">
        Video call
      </option>

      <option value="audio" data-i18n="audio">
        Audio call
      </option>

      <option value="chat" data-i18n="chat">
        Chat
      </option>
    </select>

    <div style="display:flex;gap:8px;margin-top:16px;">

      <button onclick="bookNow()" data-i18n="book_consultation">
        Book
      </button>

      <button
        class="ghost"
        onclick="document.getElementById('dlg').close()"
        data-i18n="cancel">
        Cancel
      </button>

    </div>

  </dialog>

  <nav class="bottom-nav app-bottom-nav" aria-label="Main navigation">

    <a href="home.html" class="nav-item">
      <span>🏠</span>
      <span data-i18n="home">Home</span>
    </a>

    <a href="track.html" class="nav-item">
      <span>✏️</span>
      <span data-i18n="track">Track</span>
    </a>

    <a href="insights.html" class="nav-item">
      <span>📈</span>
      <span data-i18n="insights">Insights</span>
    </a>

    <a href="assistant.html" class="nav-item">
      <span>💬</span>
      <span data-i18n="assistant">Ask</span>
    </a>

    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span data-i18n="profile">Profile</span>
    </a>

  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>

  <script>
    let selectedDoctor = null;
    let bookingUser = null;

    function getInitials(name) {
      return name
        .split(' ')
        .slice(0, 2)
        .map(x => x.charAt(0))
        .join('');
    }

    async function renderDoctors() {
      const list = document.getElementById('doc-list');
      list.textContent = 'Loading doctors...';

      bookingUser = await requireAuth();
      if (!bookingUser) return;

      const { data: doctors, error } = await sb
        .from('doctors')
        .select('id,name,specialization,experience_years,languages,consultation_fee,verified')
        .eq('is_active', true)
        .order('name');

      if (error) {
        console.error('Could not load doctors:', error);
        list.textContent = 'Could not load doctors. Please try again later.';
        return;
      }

      if (!doctors?.length) {
        list.textContent = 'No doctors are available right now.';
        return;
      }

      window.doctors = doctors;
      list.innerHTML = doctors.map(d => `
        <div class="doc">

          <div class="av">
            ${escapeHtml(getInitials(d.name))}
          </div>

          <div class="doc-info">

            <div class="doc-name">
              ${escapeHtml(d.name)}
            </div>

            <div class="doc-meta mute">
              ${escapeHtml(d.specialization || '')} · ${Number(d.experience_years) || 0} yrs
            </div>

            <div class="doc-meta mute">
              ${escapeHtml((d.languages || []).join(', '))}
            </div>

            ${d.verified ? '<div class="verified">✓ Verified</div>' : ''}

          </div>

          <div class="doc-price">

            <strong>
              ₹${Number(d.consultation_fee) || 0}
            </strong>

            <br>

            <button onclick="openBook('${d.id}')">
              Book
            </button>

          </div>

        </div>
      `).join('');

      applyTranslations();
    }

    function openBook(id) {
      selectedDoctor =
        window.doctors?.find(d => d.id === id);

      if (!selectedDoctor) return;

      document.getElementById('d-name').textContent =
        selectedDoctor.name;

      document.getElementById('d-spec').textContent =
        selectedDoctor.specialization;

      document.getElementById('d-info').textContent =
        `${Number(selectedDoctor.experience_years) || 0} years experience · ${(selectedDoctor.languages || []).join(', ')} · ₹${Number(selectedDoctor.consultation_fee) || 0}`;

      document.getElementById('dlg').showModal();

      applyTranslations();
    }

    async function bookNow() {
      if (!selectedDoctor) return;

      if (!bookingUser) {
        document.getElementById('dlg').close();

        toast('Please login to book an appointment');

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 700);

        return;
      }

      const time =
        document.getElementById('d-time').value;

      const mode =
        document.getElementById('d-mode').value;

      const now = new Date();
      const date = new Date(
        now.getTime() - now.getTimezoneOffset() * 60000
      ).toISOString().slice(0, 10);

      const { error: bookingError } =
        await sb
          .from('appointments')
          .insert({
            user_id: bookingUser.id,
            doctor_id: selectedDoctor.id,
            appointment_date: date,
            appointment_time: time + ':00',
            status: 'pending',
            mode
          });

      if (bookingError) {
        console.error(bookingError);
        toast('Could not book appointment');
        return;
      }

      document.getElementById('dlg').close();

      toast('Appointment booked successfully');
    }

    document.addEventListener(
      'carexLanguageChanged',
      () => {
        applyTranslations();
      }
    );

    renderDoctors();
  </script>

</body>
</html>
