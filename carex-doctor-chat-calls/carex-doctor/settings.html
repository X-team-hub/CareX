<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings – CareX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/doctor-layout.css"><link rel="stylesheet" href="css/doctor-dashboard.css"><link rel="stylesheet" href="css/doctor-responsive.css"></head>
<body><div class="main"><main class="content"><h2 style="font-size:26px;margin-bottom:18px">Settings</h2><div class="card"><h2>Account</h2><form class="form" onsubmit="return false"><label>Email<input type="text"></label><label>Phone<input type="text"></label></form></div><div class="card"><h2>Change Password</h2><form class="form" onsubmit="return false"><label>Current password<input type="text"></label><label>New password<input type="text"></label></form><br><button class="btn">Update</button></div><div class="card"><h2>Notification Preferences</h2><label><input type="checkbox" style="width:auto;min-height:0"> Email alerts</label></div><div class="card"><h2>Privacy</h2><label><input type="checkbox" style="width:auto;min-height:0"> Show profile publicly</label></div><div id="logout" class="card"><h2>Logout</h2><button class="btn ghost" id="logoutBtn" onclick="CareXDoctor.logout()">Logout</button></div><div class="note">Backend needed: wire Logout to your existing signOut function.</div></main></div>
<script src="js/doctor-layout.js"></script><script src="js/doctor-dashboard.js"></script></body></html>
