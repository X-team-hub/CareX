<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointments – CareX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/doctor-layout.css"><link rel="stylesheet" href="css/doctor-dashboard.css"><link rel="stylesheet" href="css/doctor-responsive.css"></head>
<body><div class="main"><main class="content"><h2 style="font-size:26px;margin-bottom:18px">Appointments</h2><div class="card"><h2>Appointments</h2><div class="toolbar"><input type="search" placeholder="Search patient or ID…"><select><option>All</option><option>Today</option><option>Upcoming</option><option>Pending</option><option>Confirmed</option><option>Cancelled</option></select></div><div class="tw"><table><thead><tr><th>Date & Time</th><th>Patient</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr><td colspan="5" class="empty">No records yet.</td></tr></tbody></table></div><a class="btn ghost" href="appointment-details.html">View appointment details</a> <button class="btn">Accept</button> <button class="btn ghost">Reject</button> <button class="btn ghost">Reschedule</button></div><div class="note">Backend needed: appointments table + status update / reschedule policies.</div></main></div>
<script src="js/doctor-layout.js"></script><script src="js/doctor-dashboard.js"></script><script>
// When appointment rows are supplied by the connected backend, mark a row with
// data-patient-id, data-patient-name and data-appointment-date. Accepting adds
// that patient to the doctor's My Patients list in this browser preview.
document.addEventListener('click',function(e){const btn=e.target.closest('[data-appointment-action="accept"]');if(!btn)return;const row=btn.closest('[data-appointment-row]');if(!row)return;const userId=row.dataset.patientId,name=row.dataset.patientName,date=row.dataset.appointmentDate;if(!userId){alert('Patient User ID is missing. Load the appointment from the backend first.');return;}let patients=[];try{patients=JSON.parse(localStorage.getItem('carexAcceptedPatients')||'[]')}catch(err){}if(!patients.some(p=>p.userId===userId)){patients.push({userId,name:name||'Patient',date:date||new Date().toLocaleDateString()});localStorage.setItem('carexAcceptedPatients',JSON.stringify(patients));}row.dataset.status='accepted';btn.textContent='Accepted';btn.disabled=true;const status=row.querySelector('[data-appointment-status]');if(status)status.textContent='Accepted';});
</script></body></html>
