<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Prescription – CareX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/doctor-layout.css"><link rel="stylesheet" href="css/doctor-dashboard.css"><link rel="stylesheet" href="css/doctor-responsive.css"></head>
<body><div class="main"><main class="content"><h2 style="font-size:26px;margin-bottom:18px">Create Prescription</h2><div class="card"><h2>New Prescription</h2><form class="form" onsubmit="return false"><label>Patient<select><option>Select patient</option></select></label><label>Diagnosis<input type="text"></label><label>Medicine name<input type="text"></label><label>Dosage<input type="text"></label><label>Frequency<input type="text"></label><label>Duration<input type="text"></label><label style="grid-column:1/-1">Instructions<textarea rows="3"></textarea></label></form><br><button class="btn">Save prescription</button> <button class="btn ghost" onclick="window.print()">Print</button></div><div class="print-sheet"><h2>CareX Prescription</h2><p>Printable layout: fill form, then Print.</p></div><div class="note">Backend needed: save to prescriptions table; load patients list.</div></main></div>
<script src="js/doctor-layout.js"></script><script src="js/doctor-dashboard.js"></script></body></html>
