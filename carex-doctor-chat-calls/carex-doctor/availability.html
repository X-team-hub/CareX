<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Availability – CareX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">

<body><div class="main"><main class="content"><h2 style="font-size:26px;margin-bottom:18px">My Availability</h2><div class="card"><h2>Weekly Schedule</h2><form class="form" onsubmit="return false"><label>Working days<input type="text"></label><label>Start time<input type="time"></label><label>End time<input type="time"></label><label>Break start<input type="time"></label><label>Break end<input type="time"></label><label>Slot duration<select><option>15 min</option><option>20 min</option><option>30 min</option><option>45 min</option></select></label></form></div><div class="card"><h2>Dates & Leave</h2><form class="form" onsubmit="return false"><label>Unavailable from<input type="date"></label><label>Unavailable to<input type="date"></label><label>Reason<input type="text"></label></form><br><button class="btn">Save availability</button></div><div class="note">Backend needed: availability / leave tables.</div></main></div>
<script src="js/doctor-layout.js"></script><script src="js/doctor-dashboard.js"></script></body></html>
