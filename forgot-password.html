<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recover - CareX</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="wrap">

    <header>
      <h1 data-i18n="app_name">CareX</h1>
    </header>

    <h2 data-i18n="recover">Recover Account</h2>

    <p class="sub">
      Enter your registered email to receive a password reset link.
    </p>

    <form onsubmit="handleForgotPassword(event)">

      <label for="recover_input">
        Email
      </label>

      <input
        id="recover_input"
        name="recover_input"
        type="email"
        placeholder="Enter registered email"
        autocomplete="email"
        required
      >

      <button type="submit">
        Send Reset Link
      </button>

    </form>

    <p style="text-align:center;margin-top:16px;">
      <a
        href="login.html"
        style="color:var(--rose);text-decoration:none;"
        data-i18n="login">
        Back to Login
      </a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>

</body>
</html>
