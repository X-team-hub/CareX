<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#171A20">
<title>Session Expired | CareX Owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="css/owner-welcome.css">
<link rel="stylesheet" href="css/owner-login.css">
<link rel="stylesheet" href="css/owner-auth.css">
</head>
<body data-page="expired">
<div class="glow" aria-hidden="true"></div>
<main class="stage">
  <header class="brand reveal" style="--d:0">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect class="tile" x="1" y="1" width="46" height="46" rx="11" pathLength="1" />
      <path class="heart" pathLength="1" d="M24 37S9 28 9 18a7.5 7.5 0 0 1 15-2 7.5 7.5 0 0 1 15 2c0 10-15 19-15 19z" />
    </svg>
    <span class="wordmark">CareX <em>Owner</em></span>
  </header>
  <section class="login" aria-label="Session Expired">
    <div class="card reveal" style="--d:1">
      <span class="ico clock" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <div class="state">
        <h1 id="title" tabindex="-1">Session Expired</h1>
        <p class="sub">For your security, your session has ended. Authenticate again to continue.</p>
        <a href="owner-login.html?reason=expired" class="cta"><span>RE-AUTHENTICATE</span></a>
        <a href="owner-login.html" class="cta ghost"><span>RETURN TO LOGIN</span></a>
      </div>
      <a href="owner-welcome.html" class="back" id="backLink"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to Welcome</a>
    </div>
    <p class="secure sec-note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.5v5.8c0 4.6 3.1 8.6 7.5 10.2 4.4-1.6 7.5-5.6 7.5-10.2V5.5L12 2.5Z"/><path d="m8.8 12 2.3 2.3 4.2-4.6"/></svg>
      <span>Sessions end automatically to protect the Owner Control Center.</span>
    </p>
  </section>
</main>
<footer class="foot reveal" style="--d:2">
  <span class="foot-brand">CareX</span>
  <span>&copy; <span id="year">2026</span> CareX. All rights reserved.</span>
</footer>
<script src="js/owner-auth.js"></script>
</body>
</html>
