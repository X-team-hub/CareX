<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#171A20">
<title>Owner Sign In | CareX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<!-- Shared brand, background, button and footer styles come from the landing page stylesheet. -->
<link rel="stylesheet" href="css/owner-welcome.css">
<link rel="stylesheet" href="css/owner-login.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<main class="stage">
  <header class="brand reveal" style="--d:0">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect class="tile" x="1" y="1" width="46" height="46" rx="11" pathLength="1" />
      <path class="heart" pathLength="1" d="M24 37S9 28 9 18a7.5 7.5 0 0 1 15-2 7.5 7.5 0 0 1 15 2c0 10-15 19-15 19z" />
    </svg>
    <span class="wordmark">CareX <em>Owner</em></span>
  </header>

  <section class="login" aria-labelledby="title">
    <div class="card reveal" style="--d:1">
      <h1 id="title">Welcome Back</h1>
      <p class="sub">Sign in to your Owner Control Center.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="identity">Owner Email / Owner ID</label>
          <input id="identity" name="identity" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="identityErr">
          <p class="err" id="identityErr" role="alert"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="passwordErr">
            <button type="button" id="togglePw" class="eye" aria-label="Show password" aria-pressed="false">
              <svg class="i-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <p class="err" id="passwordErr" role="alert"></p>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember" name="remember">
            <span class="box" aria-hidden="true"></span>
            Remember this device
          </label>
          <a href="owner-forgot-password.html" id="forgot" class="link">Forgot Password?</a>
        </div>

        <button type="submit" class="cta" id="submitBtn"><span>ACCESS SECURELY</span></button>

        <p id="formNotice" class="notice" role="status" aria-live="polite" hidden></p>
      </form>

      <a href="owner-welcome.html" class="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back to Welcome
      </a>
    </div>

    <p class="secure sec-note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.5v5.8c0 4.6 3.1 8.6 7.5 10.2 4.4-1.6 7.5-5.6 7.5-10.2V5.5L12 2.5Z"/><path d="m8.8 12 2.3 2.3 4.2-4.6"/></svg>
      <span>Authorized CareX ownership only. Never share your credentials, and sign out when you finish on a shared device.</span>
    </p>
  </section>
</main>

<footer class="foot reveal" style="--d:2">
  <span class="foot-brand">CareX</span>
  <span>&copy; <span id="year">2026</span> CareX. All rights reserved.</span>
</footer>

<script src="js/owner-login.js"></script>
</body>
</html>
