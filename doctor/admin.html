<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Doctor Admin - CareX</title>
  <link
    rel="icon"
    type="image/png"
    href="../assets/images/doctor-logo.png"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --deep-teal: #115E59;
      --healthcare-teal: #0D9488;
      --soft-mint: #E6F7F4;
      --clean-white: #FFFFFF;
      --bg-light: #F0FDF9;
      --text-primary: #0F3D3A;
      --text-secondary: #4A6B68;
      --border-color: #CCE5E2;
      --danger: #B42318;
      --danger-bg: #FEF3F2;
      --success: #15803D;
      --success-bg: #ECFDF3;
      --radius: 16px;
      --shadow-premium:
        0 20px 40px -12px rgba(17, 94, 89, 0.1),
        0 8px 16px -8px rgba(17, 94, 89, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-light);
      color: var(--text-primary);
      font-family: "DM Sans", sans-serif;
    }

    .doctor-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 50px;
    }

    .doctor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
    }

    .doctor-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--deep-teal);
      font-weight: 700;
      font-size: 1.35rem;
      text-decoration: none;
      font-family: "Fraunces", serif;
    }

    .doctor-brand-logo {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 10px;
    }

    .doctor-card {
      padding: 28px;
      margin-bottom: 24px;
      background: var(--clean-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-premium);
      animation: fadeInUp 0.35s ease-out;
    }

    .doctor-card h1,
    .doctor-card h2,
    .doctor-card h3 {
      color: var(--deep-teal);
      font-family: "Fraunces", serif;
      font-weight: 700;
    }

    .doctor-card h1 {
      margin: 14px 0 10px;
      font-size: clamp(25px, 4vw, 34px);
    }

    .doctor-card h2 {
      font-size: 25px;
    }

    .doctor-card h3 {
      font-size: 19px;
    }

    .small {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.65;
    }

    .doctor-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 43px;
      padding: 11px 18px;
      border: 1px solid var(--healthcare-teal);
      border-radius: 10px;
      background: var(--healthcare-teal);
      color: #fff;
      font: 700 14px "DM Sans", sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .doctor-btn:hover {
      background: var(--deep-teal);
      border-color: var(--deep-teal);
      transform: translateY(-1px);
    }

    .doctor-btn.secondary {
      background: #fff;
      color: var(--deep-teal);
      border-color: var(--border-color);
    }

    .doctor-btn.secondary:hover {
      background: var(--soft-mint);
      border-color: var(--healthcare-teal);
    }

    .doctor-btn.danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    .doctor-btn.danger:hover {
      background: #991B1B;
      border-color: #991B1B;
    }

    .doctor-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 11px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--soft-mint);
      color: var(--deep-teal);
      font-size: 12px;
      font-weight: 700;
    }

    .doctor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .doctor-feature {
      background: var(--soft-mint);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .doctor-feature strong {
      display: block;
      font-size: 2rem;
      color: var(--deep-teal);
      font-family: "Fraunces", serif;
    }

    .doctor-feature span {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .doc-table th {
      text-align: left;
      padding: 12px;
      color: var(--text-secondary);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border-color);
    }

    .doc-table td {
      padding: 16px 12px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .doc-table tr:hover td {
      background: var(--soft-mint);
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .status.verified {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #BBF7D0;
    }

    .status.changes_required {
      background: #FFFBEB;
      color: #A16207;
      border: 1px solid #FDE68A;
    }

    .status.under_review,
    .status.submitted {
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #BFDBFE;
    }

    .status.rejected {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #FECACA;
    }

    .status.draft {
      background: #F3F4F6;
      color: #4B5563;
      border: 1px solid #D1D5DB;
    }

    .review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 18px;
    }

    .step-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .step {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: start;
      gap: 13px;
      padding: 14px;
      border: 1px solid var(--border-color);
      border-radius: 13px;
      background: #fff;
    }

    .step-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--soft-mint);
      color: var(--deep-teal);
      font-size: 14px;
      font-weight: 700;
    }

    .step-title {
      margin: 2px 0 5px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
    }

    .step-note {
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.65;
    }

    .file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .file-row strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text-primary);
      font-size: 14px;
    }

    .doctor-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    .doctor-field label {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
    }

    .doctor-field textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #FAFAFA;
      color: var(--text-primary);
      font: 400 14px "DM Sans", sans-serif;
      resize: vertical;
      outline: none;
    }

    .doctor-field textarea:focus {
      border-color: var(--healthcare-teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .notice {
      padding: 13px 15px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.65;
    }

    .notice.danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #FECACA;
    }

    #doctor-toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 99999;
      max-width: 420px;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--deep-teal);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .doctor-shell {
        width: min(100% - 20px, 1120px);
      }

      .doctor-header {
        padding: 16px 0;
      }

      .doctor-card {
        padding: 20px;
      }

      .review-grid {
        grid-template-columns: 1fr;
      }

      .doc-table {
        display: block;
        overflow-x: auto;
      }

      .file-row {
        flex-direction: column;
        align-items: stretch;
      }

      .step {
        grid-template-columns: 34px minmax(0, 1fr);
      }

      .step > .status {
        grid-column: 2;
        width: fit-content;
      }
    }
  </style>
</head>

<body class="doctor-body">

  <div class="doctor-shell">

    <header class="doctor-header">

      <a class="doctor-brand" href="./index.html">
        <img
          src="../assets/images/doctor-logo.png"
          alt="CareX Logo"
          class="doctor-brand-logo"
        >
        Doctor Admin
      </a>

      <button
        type="button"
        class="doctor-btn secondary"
        onclick="doctorLogout()"
      >
        Logout
      </button>

    </header>

    <div id="app">
      <section class="doctor-card">
        <div class="small">
          Loading admin panel...
        </div>
      </section>
    </div>

  </div>

  <!-- IMPORTANT: root paths -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/common.js"></script>
  <script>
    let admin = null;
    let selected = null;

    /* =========================================================
       SAFE HELPERS
       ========================================================= */

    function doctorEscape(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function doctorStatusLabel(status) {
      const labels = {
        draft: "Draft",
        submitted: "Submitted",
        under_review: "Under Review",
        verified: "Verified",
        changes_required: "Changes Required",
        rejected: "Rejected"
      };

      return labels[status] || String(status || "Unknown");
    }

    function doctorToast(message) {
      const oldToast = document.getElementById("doctor-toast");

      if (oldToast) {
        oldToast.remove();
      }

      const toast = document.createElement("div");

      toast.id = "doctor-toast";
      toast.textContent = String(message ?? "");

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3500);
    }

    async function doctorLogout() {
      try {
        if (
          typeof carexSupabase !== "undefined" &&
          carexSupabase &&
          carexSupabase.auth
        ) {
          const { error } =
            await carexSupabase.auth.signOut();

          if (error) {
            console.error(
              "Doctor logout error:",
              error
            );
          }
        }
      } catch (error) {
        console.error(
          "Doctor logout failed:",
          error
        );
      } finally {
        window.location.href = "./admin-login.html";
      }
    }

    function showError(message) {
      const app = document.getElementById("app");

      if (!app) {
        return;
      }

      app.innerHTML = `
        <section class="doctor-card">
          <div class="notice danger">
            Failed to load:
            ${doctorEscape(message)}
          </div>
        </section>
      `;
    }

    async function requireAdmin() {
      const { data: { user }, error: userError } =
        await carexSupabase.auth.getUser();

      if (userError || !user) {
        window.location.href = "./admin-login.html";
        return null;
      }

      const { data: role, error: roleError } = await carexSupabase
        .from("carex_user_roles")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();

      if (roleError) {
        throw roleError;
      }

      if (role?.role !== "admin") {
        await carexSupabase.auth.signOut();
        window.location.href = "./admin-login.html";
        return null;
      }

      return user;
    }

    /* =========================================================
       LOAD ADMIN DASHBOARD
       ========================================================= */

    async function load() {
      try {

        if (
          typeof carexSupabase === "undefined" ||
          !carexSupabase
        ) {
          showError(
            "Supabase connection is not available."
          );
          return;
        }

        admin = await requireAdmin();

        if (!admin) {
          return;
        }

        const {
          data: docs,
          error
        } = await carexSupabase
          .from("carex_doctor_profiles")
          .select("*")
          .order("updated_at", {
            ascending: false
          });

        if (error) {
          throw error;
        }

        const doctorList = docs || [];

        const ids = doctorList.map(
          doctor => doctor.id
        );

        let steps = [];

        if (ids.length) {

          const {
            data,
            error: stepError
          } = await carexSupabase
            .from("carex_doctor_verification_steps")
            .select("*")
            .in("doctor_id", ids);

          if (stepError) {
            throw stepError;
          }

          steps = data || [];
        }

        const stats = {
          total: doctorList.length,

          review: doctorList.filter(
            doctor =>
              ["submitted", "under_review"]
                .includes(doctor.status)
          ).length,

          verified: doctorList.filter(
            doctor =>
              doctor.status === "verified"
          ).length,

          changes: doctorList.filter(
            doctor =>
              doctor.status === "changes_required"
          ).length
        };

        document.getElementById("app").innerHTML = `

          <section class="doctor-card">

            <span class="doctor-badge">
              ADMIN PANEL
            </span>

            <h1>Doctor Verification</h1>

            <div class="doctor-grid">

              <div class="doctor-feature">
                <strong>${stats.total}</strong>
                <span>Total Applications</span>
              </div>

              <div class="doctor-feature">
                <strong>${stats.review}</strong>
                <span>Need Review</span>
              </div>

              <div class="doctor-feature">
                <strong>${stats.verified}</strong>
                <span>Verified</span>
              </div>

              <div class="doctor-feature">
                <strong>${stats.changes}</strong>
                <span>Changes Required</span>
              </div>

            </div>

          </section>

          <section class="doctor-card">

            <table class="doc-table">

              <thead>
                <tr>
                  <th>Doctor</th>
                  <th>Status</th>
                  <th>Steps</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody>

                ${
                  doctorList.length

                    ? doctorList.map(doctor => {

                        const doctorSteps =
                          steps.filter(
                            step =>
                              step.doctor_id ===
                              doctor.id
                          );

                        const verifiedSteps =
                          doctorSteps.filter(
                            step =>
                              step.status ===
                              "verified"
                          ).length;

                        const statusClass =
                          doctor.status ===
                          "verified"
                            ? "verified"

                            : doctor.status ===
                              "changes_required"
                              ? "changes_required"

                              : doctor.status ===
                                "rejected"
                                ? "rejected"

                                : doctor.status ===
                                  "submitted"
                                  ? "submitted"

                                  : doctor.status ===
                                    "draft"
                                    ? "draft"

                                    : "under_review";

                        return `
                          <tr>

                            <td>
                              <strong>
                                ${doctorEscape(
                                  doctor.full_name
                                )}
                              </strong>

                              <div class="small">
                                ${doctorEscape(
                                  doctor.specialization ||
                                  ""
                                )}
                              </div>
                            </td>

                            <td>
                              <span
                                class="status ${statusClass}"
                              >
                                ${doctorEscape(
                                  doctorStatusLabel(
                                    doctor.status
                                  )
                                )}
                              </span>
                            </td>

                            <td>
                              ${verifiedSteps}/${doctorSteps.length}
                            </td>

                            <td>
                              <button
                                type="button"
                                class="doctor-btn"
                                onclick="openDoctor('${doctorEscape(
                                  doctor.id
                                )}')"
                              >
                                Review
                              </button>
                            </td>

                          </tr>
                        `;
                      }).join("")

                    : `
                      <tr>
                        <td colspan="4">
                          <div class="small">
                            No doctor applications found.
                          </div>
                        </td>
                      </tr>
                    `
                }

              </tbody>

            </table>

          </section>

          <div id="review"></div>
        `;

      } catch (err) {

        console.error(
          "Admin load error:",
          err
        );

        showError(
          err?.message ||
          "Unknown error"
        );
      }
    }

    /* =========================================================
       OPEN DOCTOR
       ========================================================= */

    async function openDoctor(id) {

      try {

        const {
          data: doctor,
          error: doctorError
        } = await carexSupabase
          .from("carex_doctor_profiles")
          .select("*")
          .eq("id", id)
          .single();

        if (doctorError) {
          throw doctorError;
        }

        const {
          data: doctorSteps,
          error: stepError
        } = await carexSupabase
          .from("carex_doctor_verification_steps")
          .select("*")
          .eq("doctor_id", id)
          .order("created_at");

        if (stepError) {
          throw stepError;
        }

        const {
          data: files,
          error: fileError
        } = await carexSupabase
          .from("carex_doctor_documents")
          .select("*")
          .eq("doctor_id", id)
          .order("uploaded_at", {
            ascending: false
          });

        if (fileError) {
          throw fileError;
        }

        selected = {
          d: doctor,
          s: doctorSteps || [],
          files: files || []
        };

        const review =
          document.getElementById("review");

        if (!review) {
          return;
        }

        review.innerHTML = `

          <section class="doctor-card">

            <div
              style="
                display:flex;
                justify-content:space-between;
                gap:10px;
                align-items:flex-start;
                flex-wrap:wrap;
              "
            >

              <div>

                <h2>
                  ${doctorEscape(
                    doctor.full_name
                  )}
                </h2>

                <p class="small">
                  ${doctorEscape(
                    doctor.qualification || ""
                  )}
                  ·
                  ${doctorEscape(
                    doctor.registration_number || ""
                  )}
                </p>

              </div>

              <button
                type="button"
                class="doctor-btn secondary"
                onclick="load()"
              >
                Close Review
              </button>

            </div>

            <div class="review-grid">

              <!-- PROFILE -->
              <div>

                <h3>Profile Details</h3>

                <div
                  class="small"
                  style="
                    margin-top:12px;
                    line-height:2;
                  "
                >

                  <div>
                    <strong>
                      Specialization:
                    </strong>
                    ${doctorEscape(
                      doctor.specialization || "-"
                    )}
                  </div>

                  <div>
                    <strong>
                      Council:
                    </strong>
                    ${doctorEscape(
                      doctor.registration_council ||
                      "-"
                    )}
                  </div>

                  <div>
                    <strong>
                      Registration:
                    </strong>
                    ${doctorEscape(
                      doctor.registration_number ||
                      "-"
                    )}
                  </div>

                  <div>
                    <strong>
                      Clinic:
                    </strong>
                    ${doctorEscape(
                      doctor.clinic_name || "-"
                    )}
                  </div>

                  <div>
                    <strong>
                      City:
                    </strong>
                    ${doctorEscape(
                      doctor.city || "-"
                    )}
                  </div>

                  <div>
                    <strong>
                      Experience:
                    </strong>
                    ${doctorEscape(
                      doctor.experience_years ??
                      "-"
                    )}
                    years
                  </div>

                  <div>
                    <strong>
                      Bio:
                    </strong>
                    ${doctorEscape(
                      doctor.bio || "-"
                    )}
                  </div>

                </div>

              </div>

              <!-- VERIFICATION -->
              <div>

                <h3>
                  Verification Steps
                </h3>

                <div class="step-list">

                  ${
                    selected.s.length

                      ? selected.s.map(step => `

                        <div class="step">

                          <div class="step-icon">
                            ${
                              step.status ===
                              "verified"
                                ? "✓"
                                : "•"
                            }
                          </div>

                          <div>

                            <div class="step-title">
                              ${doctorEscape(
                                step.title ||
                                step.step_key ||
                                "Verification Step"
                              )}
                            </div>

                            <div class="step-note">
                              ${
                                step.rejection_reason
                                  ? doctorEscape(
                                      step.rejection_reason
                                    )
                                  : "No review note"
                              }
                            </div>

                          </div>

                          <span
                            class="status ${
                              doctorEscape(
                                step.status ||
                                "under_review"
                              )
                            }"
                          >
                            ${doctorEscape(
                              doctorStatusLabel(
                                step.status
                              )
                            )}
                          </span>

                        </div>

                      `).join("")

                      : `
                        <div class="notice">
                          No verification steps found.
                        </div>
                      `
                  }

                </div>

              </div>

            </div>

            <!-- DOCUMENTS -->

            <h3 style="margin:28px 0 12px;">
              Documents
            </h3>

            ${
              selected.files.length

                ? selected.files.map(file => `

                    <div class="file-row">

                      <div>

                        <strong>
                          ${doctorEscape(
                            file.original_name ||
                            file.document_type ||
                            "Document"
                          )}
                        </strong>

                        <div class="small">

                          ${doctorEscape(
                            file.step_key || ""
                          )}

                          ·

                          <span
                            class="status ${
                              doctorEscape(
                                file.status ||
                                "under_review"
                              )
                            }"
                            style="
                              font-size:10px;
                              padding:2px 6px;
                            "
                          >
                            ${doctorEscape(
                              doctorStatusLabel(
                                file.status
                              )
                            )}
                          </span>

                        </div>

                      </div>

                      <button
                        type="button"
                        class="doctor-btn secondary"
                        onclick="viewFile('${doctorEscape(
                          file.id
                        )}')"
                      >
                        View Document
                      </button>

                    </div>

                  `).join("")

                : `
                    <div class="notice">
                      No documents submitted yet.
                    </div>
                  `
            }

            <!-- REVIEW NOTE -->

            <div class="doctor-field">

              <label for="reviewNote">
                Admin Review Note
              </label>

              <textarea
                id="reviewNote"
                placeholder="Explain approval, rejection, or requested changes..."
              ></textarea>

            </div>

            <!-- ACTIONS -->

            <div class="action-row">

              <button
                type="button"
                class="doctor-btn"
                onclick="approveAll()"
              >
                Approve Verified Steps
              </button>

              <button
                type="button"
                class="doctor-btn secondary"
                onclick="requestChanges()"
              >
                Request Changes
              </button>

              <button
                type="button"
                class="doctor-btn danger"
                onclick="rejectDoctor()"
              >
                Reject Application
              </button>

            </div>

          </section>
        `;

        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });

      } catch (err) {

        console.error(
          "Doctor detail error:",
          err
        );

        doctorToast(
          "Error loading doctor details: " +
          (
            err?.message ||
            "Unknown error"
          )
        );
      }
    }

    /* =========================================================
       VIEW DOCUMENT
       ========================================================= */

    async function viewFile(id) {

      const file =
        selected?.files?.find(
          item => item.id === id
        );

      if (!file) {
        doctorToast("Document not found.");
        return;
      }

      if (!file.file_path) {
        doctorToast(
          "This document does not have a file path."
        );
        return;
      }

      try {

        const {
          data,
          error
        } = await carexSupabase.storage
          .from("doctor-verification")
          .createSignedUrl(
            file.file_path,
            300
          );

        if (error) {
          doctorToast(error.message);
          return;
        }

        if (!data?.signedUrl) {
          doctorToast(
            "Unable to create document link."
          );
          return;
        }

        window.open(
          data.signedUrl,
          "_blank",
          "noopener"
        );

      } catch (error) {

        console.error(
          "View document error:",
          error
        );

        doctorToast(
          "Network error viewing file."
        );
      }
    }

    /* =========================================================
       UPDATE VERIFICATION STEP
       ========================================================= */

    async function updateStep(
      stepKey,
      status,
      note
    ) {

      if (!selected) {
        throw new Error(
          "No doctor selected."
        );
      }

      const step =
        selected.s.find(
          item =>
            item.step_key === stepKey
        );

      if (!step) {
        throw new Error(
          "Verification step not found: " +
          stepKey
        );
      }

      const {
        error: stepError
      } = await carexSupabase
        .from("carex_doctor_verification_steps")
        .update({
          status,
          rejection_reason:
            note || null,
          reviewed_by:
            admin.id,
          reviewed_at:
            new Date().toISOString()
        })
        .eq("id", step.id);

      if (stepError) {
        throw stepError;
      }

      const {
        error: reviewError
      } = await carexSupabase
        .from("carex_doctor_reviews")
        .insert({
          doctor_id:
            selected.d.id,

          step_key:
            stepKey,

          action:
            status === "verified"
              ? "approved"
              : status === "changes_required"
                ? "requested_changes"
                : "rejected",

          note:
            note || null,

          admin_id:
            admin.id
        });

      if (reviewError) {
        throw reviewError;
      }
    }

    /* =========================================================
       APPROVE DOCTOR
       ========================================================= */

    async function approveAll() {

      if (!selected) {
        doctorToast(
          "Please select a doctor first."
        );
        return;
      }

      const note =
        document.getElementById(
          "reviewNote"
        )?.value.trim() || "";

      try {

        for (
          const step of selected.s.filter(
            item =>
              item.step_key !==
              "final_review"
          )
        ) {

          await updateStep(
            step.step_key,
            "verified",
            note
          );
        }

        const finalStep =
          selected.s.find(
            item =>
              item.step_key ===
              "final_review"
          );

        if (finalStep) {

          await updateStep(
            "final_review",
            "verified",
            note
          );
        }

        const profile =
          selected.d;

        const {
          error: profileError
        } = await carexSupabase
          .from("carex_doctor_profiles")
          .update({
            status: "verified"
          })
          .eq("id", profile.id);

        if (profileError) {
          throw profileError;
        }

        const payload = {
          user_id:
            profile.id,

          name:
            profile.full_name,

          specialization:
            profile.specialization,

          qualification:
            profile.qualification,

          experience:
            profile.experience_years,

          location:
            profile.city,

          bio:
            profile.bio,

          verified:
            true,

          image_url:
            null,

          languages:
            [],

          price:
            null
        };

        const {
          error: directoryError
        } = await carexSupabase
          .from("doctors")
          .upsert(
            payload,
            {
              onConflict: "user_id"
            }
          );

        if (directoryError) {
          throw directoryError;
        }

        const {
          error: finalReviewError
        } = await carexSupabase
          .from("carex_doctor_reviews")
          .insert({
            doctor_id:
              profile.id,

            action:
              "final_approved",

            note:
              note || null,

            admin_id:
              admin.id
          });

        if (finalReviewError) {
          throw finalReviewError;
        }

        doctorToast(
          "Doctor verified and published to the directory."
        );

        selected = null;

        await load();

      } catch (err) {

        console.error(
          "Approval failed:",
          err
        );

        doctorToast(
          "Approval failed: " +
          (
            err?.message ||
            "Unknown error"
          )
        );
      }
    }

    /* =========================================================
       REQUEST CHANGES
       ========================================================= */

    async function requestChanges() {

      if (!selected) {
        doctorToast(
          "Please select a doctor first."
        );
        return;
      }

      const note =
        document.getElementById(
          "reviewNote"
        )?.value.trim() || "";

      if (!note) {
        doctorToast(
          "Please add a reason for requested changes."
        );
        return;
      }

      try {

        const {
          error
        } = await carexSupabase
          .from("carex_doctor_profiles")
          .update({
            status:
              "changes_required"
          })
          .eq(
            "id",
            selected.d.id
          );

        if (error) {
          throw error;
        }

        for (
          const step of selected.s.filter(
            item =>
              item.status !==
              "verified"
          )
        ) {

          await updateStep(
            step.step_key,
            "changes_required",
            note
          );
        }

        doctorToast(
          "Changes requested successfully."
        );

        selected = null;

        await load();

      } catch (err) {

        console.error(
          "Request changes failed:",
          err
        );

        doctorToast(
          "Failed to request changes: " +
          (
            err?.message ||
            "Unknown error"
          )
        );
      }
    }

    /* =========================================================
       REJECT DOCTOR
       ========================================================= */

    async function rejectDoctor() {

      if (!selected) {
        doctorToast(
          "Please select a doctor first."
        );
        return;
      }

      const note =
        document.getElementById(
          "reviewNote"
        )?.value.trim() || "";

      if (!note) {
        doctorToast(
          "Please add a reason for rejection."
        );
        return;
      }

      try {

        const {
          error
        } = await carexSupabase
          .from("carex_doctor_profiles")
          .update({
            status:
              "rejected"
          })
          .eq(
            "id",
            selected.d.id
          );

        if (error) {
          throw error;
        }

        for (
          const step of selected.s.filter(
            item =>
              item.step_key !==
              "final_review"
          )
        ) {

          await updateStep(
            step.step_key,
            "rejected",
            note
          );
        }

        doctorToast(
          "Application rejected."
        );

        selected = null;

        await load();

      } catch (err) {

        console.error(
          "Rejection failed:",
          err
        );

        doctorToast(
          "Rejection failed: " +
          (
            err?.message ||
            "Unknown error"
          )
        );
      }
    }

    /* =========================================================
       START ADMIN PANEL
       ========================================================= */

    load();

  </script>

</body>
</html>
